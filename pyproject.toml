[project]
name = "pycvrx"
version = "0.1.1"
description = "Python SDK for Reactive Resume API"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
    { name = "Bruno Testaguzza Carlin" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11",
    "jsonschema>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-jsonschema>=4.24",
]

[project.urls]
Homepage = "https://github.com/brunocarlin/pycvrx"
Repository = "https://github.com/brunocarlin/pycvrx"
Issues = "https://github.com/brunocarlin/pycvrx/issues"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pycvrx",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]