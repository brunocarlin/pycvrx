name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run Ruff
        run: |
          uv run ruff check .

      - name: Run MyPy
        run: |
          uv run mypy src

      - name: Run Tests
        run: |
          uv run pytest --cov=src --cov-report=term-missing